<p class="subtitle">diseñemos tus ideas</p>

  
      <form action="https://formspree.io/f/meorkaqr" method="POST" class="contact-form">
        <div class="form-group">
          <label for="name">Nombre completo</label>
          <input type="text" id="name" name="name" placeholder="Tu nombre" required>
        </div>
  
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="_replyto" placeholder="tu@email.com" required>
        </div>
  
        <div class="form-group">
          <label for="type">Tipo de consulta</label>
          <select id="type" name="type" required>
            <option value="">Seleccioná una opción</option>
            <option value="Branding">Branding</option>
            <option value="Social Media">Social Media</option>
            <option value="Packaging">Packaging</option>
            <option value="Diseño web">Diseño web</option>
            <option value="Diseño de interiores">Diseño de interiores</option>
          </select>
        </div>
  
        <div class="form-group">
          <label for="message">Mensaje</label>
          <textarea id="message" name="message" rows="5" placeholder="Contanos más..." required></textarea>
        </div>
  
        <button type="submit" class="btn-submit">Enviar</button>
      </form>
